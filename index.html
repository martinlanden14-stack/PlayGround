<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1210" />
  <meta name="description" content="Emberfield — a hand-crafted colony survival simulation. Build, farm, research and defend your settlers." />
  <title>Emberfield — Colony Sim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161c18'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23d8b87a'%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Colony map"></canvas>

    <header id="topbar">
      <div class="tb-left">
        <div class="colony-mark">
          <span class="mark-glyph">◈</span>
          <div class="colony-titles">
            <div id="colonyName">Emberfield</div>
            <div id="colonySub">Aprimay · Day 1</div>
          </div>
        </div>
        <div class="wealth" id="wealth"><span>Wealth</span><b>0</b></div>
      </div>

      <div class="tb-res" id="resources"></div>

      <div class="tb-right">
        <div class="clock-block">
          <div class="clock-row">
            <span id="weatherGlyph" class="weather-glyph">☀</span>
            <span id="clock">08:15</span>
          </div>
          <div id="weather" class="weather-text">Clear skies</div>
        </div>
        <div class="speed-control" id="speedControls" role="group" aria-label="Time controls">
          <button data-speed="0" title="Pause (Space)" aria-label="Pause">❚❚</button>
          <button data-speed="1" class="active" title="Normal speed (1)">▶</button>
          <button data-speed="2" title="Fast (2)">▶▶</button>
          <button data-speed="3" title="Ultra (3)">▶▶▶</button>
        </div>
        <button id="btnMute" class="icon-btn" title="Toggle sound" aria-label="Toggle sound">♪</button>
        <button id="btnHelp" class="icon-btn" title="Help (H)" aria-label="Help">?</button>
      </div>
    </header>

    <div id="colonistBar" aria-label="Colonists"></div>

    <div id="alerts"></div>

    <div id="notifications" aria-live="polite"></div>

    <aside id="inspector" class="panel hidden" aria-live="polite"></aside>

    <section id="architect" class="panel hidden" aria-label="Architect">
      <div class="arch-head">
        <div id="archCats" class="arch-cats"></div>
        <button id="archClose" class="close-btn" aria-label="Close build menu">✕</button>
      </div>
      <div id="archItems" class="arch-items"></div>
      <div id="archFoot" class="arch-foot"></div>
    </section>

    <div id="toolHint" class="hidden">
      <span class="tool-dot"></span>
      <span id="toolText">Building</span>
      <button id="toolRotate" title="Rotate (R)">⟳ Rotate</button>
      <button id="toolCancel" title="Cancel (Esc)">✕</button>
    </div>

    <nav id="mainTabs" aria-label="Main tabs">
      <button data-tab="architect" class="tab active"><span class="tab-glyph">⌂</span><span>Architect</span></button>
      <button data-tab="work"><span class="tab-glyph">☰</span><span>Work</span></button>
      <button data-tab="research"><span class="tab-glyph">✦</span><span>Research</span></button>
      <button data-tab="log"><span class="tab-glyph">✎</span><span>Log</span></button>
      <button data-tab="menu"><span class="tab-glyph">⚙</span><span>Menu</span></button>
    </nav>

    <div id="minimapWrap">
      <canvas id="minimap" width="192" height="192"></canvas>
      <div class="mini-label">Emberfield</div>
    </div>

    <div id="sheetBackdrop" class="backdrop hidden"></div>
    <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>

    <div id="toast" role="status"></div>

    <div id="help" class="overlay hidden" role="dialog" aria-modal="true"></div>

    <div id="loading">
      <div class="load-mark">◈</div>
      <div class="load-title">Emberfield</div>
      <div class="load-sub">Raising the colony…</div>
      <div class="load-bar"><i></i></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
